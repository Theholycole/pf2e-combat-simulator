# A published release (tag vX.Y.Z) gets the installable module: module.json with that version and its
# download URL, and module.zip holding what Foundry loads. Same as the core's and the spell module's.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the version and the download URL
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg version "$VERSION" --arg download "$DOWNLOAD" '.version = $version | .download = $download' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Zip the module
        run: zip -r module.zip module.json LICENSE README.md scripts src styles

      - name: Attach module.json and module.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
